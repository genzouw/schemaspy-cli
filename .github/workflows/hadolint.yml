name: hadolint

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
on:
  push:
    branches: [main, master]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.hadolint.yaml'
      - '.github/workflows/hadolint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.hadolint.yaml'
      - '.github/workflows/hadolint.yml'

concurrency:
  group: hadolint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    uses: genzouw/ci-workflows/.github/workflows/hadolint.yml@458d24cd2f85f1e66c35cfb0de42d2d425909a6d # v1.5.5
