name: shellcheck

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
on:
  push:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    uses: genzouw/ci-workflows/.github/workflows/shellcheck.yml@25d9ccba55e73641a6998b24fe89ddfbb020beed # v1.4.1
