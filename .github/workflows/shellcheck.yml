name: shellcheck

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
on:
  push:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    uses: genzouw/ci-workflows/.github/workflows/shellcheck.yml@72c41cae612a1cea531036dbe6d1970266b1b547 # v1.4.7
