name: zizmor

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
# 必須チェック (context: "zizmor / zizmor") のため paths フィルタ禁止。
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    uses: genzouw/ci-workflows/.github/workflows/zizmor.yml@7159f7af3c1dea2a115b31c3574ce47bfb0cf09b # v1.4.3
